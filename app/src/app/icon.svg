<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- clip the fuel level to the ring's outer edge so the two meet cleanly at any size -->
    <clipPath id="ring"><circle cx="11" cy="11" r="10.8"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#000"/>
  <g transform="translate(10 10) scale(2)">
    <circle cx="11" cy="11" r="10" fill="none" stroke="#ecece6" stroke-width="1.6"/>
    <rect x="0" y="13.5" width="22" height="9" fill="#f7931a" clip-path="url(#ring)"/>
  </g>
</svg>
